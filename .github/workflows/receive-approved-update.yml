name: Receive approved portfolio update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/receive-approved-update.yml']
permissions:
  contents: write
concurrency:
  group: approved-public-update
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Receive exact approved public-only archive
        env:
          APPROVED_PACKAGE: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-a0cc-81fd-bdb2-d5cecb94497a/raw?se=2026-11-13T19%3A41%3A53Z&sp=r&sv=2026-06-06&sr=b&scid=c3ca8302-74a3-5c9d-87a8-6c932d5e475d&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T19%3A34%3A53Z&ske=2026-11-14T19%3A34%3A53Z&sks=b&skv=2026-06-06&sig=BKa8TyKKODQFGX3VzYxGwGwec8IPydn2J3qrQ0d6x2s%3D'
        run: |
          echo "::add-mask::$APPROVED_PACKAGE"
          python - <<'PY'
          from pathlib import Path
          import hashlib,os,zipfile,shutil,re,json
          from urllib.request import urlopen,Request
          archive=Path(os.environ['RUNNER_TEMP'])/'approved.zip'
          with urlopen(Request(os.environ['APPROVED_PACKAGE'],headers={'User-Agent':'approved-portfolio-release'}),timeout=90) as source,archive.open('wb') as dest:
              shutil.copyfileobj(source,dest)
          assert archive.stat().st_size==303600157
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()=='9dfcd51abed2cbd9501d085ccf63d6ee7563b14abecdacd2181ed8e5c416bdf6'
          out=Path(os.environ['RUNNER_TEMP'])/'approved-site';out.mkdir()
          allowed_ext={'.html','.css','.js','.png','.jpg','.jpeg','.webp','.svg','.mp4','.mov','.txt','.woff','.woff2','.ico'}
          with zipfile.ZipFile(archive) as bundle:
              assert len(bundle.namelist())==91
              for info in bundle.infolist():
                  p=Path(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert all(not segment.startswith('.') for segment in p.parts)
                  assert not any(segment in {'editor','scripts','notes','incoming-schedules','resume'} for segment in p.parts[:-1])
                  assert p.suffix.lower() in allowed_ext
                  assert info.file_size<100*1024*1024
                  target=out/p;target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(bundle.read(info))
          for p in out.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.html','.css','.js','.txt'}:
                  text=p.read_text(encoding='utf-8')
                  assert not re.search(r'Yucaipa|909[\s()\-\u2010-\u2015]*771[\s\-\u2010-\u2015]*1594|19097711594|Benjamin_Nocera_Web_Resume\.pdf',text,re.I),p.name
          content=json.loads((out/'content.js').read_text().split('=',1)[1].strip().rstrip(';'))
          assert [p['title'] for p in content['projects']]==['Powered Wagon','Swing Tracker','Drone Project']
          assert (out/'projects/drone.html').exists()
          print('Validated 91 approved visitor-facing files. No private source, editor, PDFs, or development history in this archive.')
          PY
      - name: Commit audited site only
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='CNAME' "$RUNNER_TEMP/approved-site/" ./
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish completed Wagon milestones, looping user-test preview, Drone phases and refreshed schedules'
          git push origin HEAD:main
